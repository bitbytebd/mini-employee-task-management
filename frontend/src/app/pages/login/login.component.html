<section class="login-page"><form [formGroup]="form" (ngSubmit)="submit()" class="login-card"><p class="eyebrow">FIFO TECH</p><h1>Sign in</h1><p>Use your assigned email and password.</p><label>Email<input type="email" formControlName="email" autocomplete="email"></label><label>Password<input type="password" formControlName="password" autocomplete="current-password"></label><p class="error" *ngIf="error">{{ error }}</p><button type="submit" [disabled]="loading">{{ loading ? 'Signing in…' : 'Sign in' }}</button></form></section>
