<section class="page"><h1>Users</h1><p *ngIf="!auth.hasRole('ADMIN')">Only administrators can manage users.</p><ng-container *ngIf="auth.hasRole('ADMIN')"><div class="two-column"><form [formGroup]="form" (ngSubmit)="submit()" class="panel"><h2>{{ editing ? 'Edit user' : 'Create user' }}</h2><label>Name<input formControlName="fullName"></label><label>Username<input formControlName="username"></label><label>Email<input type="email" formControlName="email"></label><label>Password<input type="password" formControlName="password" [required]="!editing"></label><label>Role<select formControlName="roles"><option>ADMIN</option><option>MANAGER</option><option>EMPLOYEE</option></select></label><label>Manager ID (employees only)<input type="number" formControlName="managerId"></label><label class="check"><input type="checkbox" formControlName="enabled"> Active</label><p class="error" *ngIf="error">{{ error }}</p><button>Save user</button><button type="button" class="secondary" (click)="reset()">Clear</button></form><div class="panel"><h2>Current users</h2><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody><tr *ngFor="let user of users"><td>{{ user.fullName }}<small>{{ user.email }}</small></td><td>{{ user.roles.join(', ') }}</td><td>{{ user.enabled ? 'Active' : 'Inactive' }}</td><td><button type="button" (click)="edit(user)">Edit</button><button type="button" class="danger" (click)="remove(user)">Delete</button></td></tr></tbody></table></div></div></ng-container></section>
