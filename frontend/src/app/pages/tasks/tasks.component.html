<section class="page"><div class="title-row"><div><h1>Tasks</h1><p>Tasks shown are restricted by your role.</p></div><button *ngIf="canManage()" (click)="report()">Download PDF report</button></div><p class="error" *ngIf="error">{{ error }}</p><div class="two-column" *ngIf="canManage()"><form [formGroup]="form" (ngSubmit)="submit()" class="panel"><h2>{{ editing ? 'Edit task' : 'Create task' }}</h2><label>Title<input formControlName="title"></label><label>Description<textarea formControlName="description"></textarea></label><label>Priority<select formControlName="priority"><option>LOW</option><option>MEDIUM</option><option>HIGH</option></select></label><label>Assignee<select formControlName="assigneeId"><option value="">Select employee</option><option *ngFor="let user of users" [value]="user.id">{{ user.fullName }}</option></select></label><label>Deadline<input type="date" formControlName="deadline"></label><button>Save task</button><button type="button" class="secondary" (click)="reset()">Clear</button></form><div class="panel"><ng-container *ngTemplateOutlet="taskTable"></ng-container></div></div><div class="panel" *ngIf="!canManage()"><ng-container *ngTemplateOutlet="taskTable"></ng-container></div></section><ng-template #taskTable><table><thead><tr><th>Task</th><th>Priority</th><th>Status</th><th>Assignee</th><th>Deadline</th><th></th></tr></thead><tbody><tr *ngFor="let task of tasks"><td>{{ task.title }}<small>{{ task.description }}</small></td><td>{{ task.priority }}</td><td>{{ task.status }}</td><td>{{ task.assigneeName }}</td><td>{{ task.deadline }}</td><td><button *ngIf="canManage()" (click)="edit(task)">Edit</button><button *ngIf="auth.hasRole('ADMIN')" class="danger" (click)="remove(task)">Delete</button><button *ngIf="auth.hasRole('EMPLOYEE') && task.status !== 'DONE'" (click)="advance(task)">Advance</button></td></tr></tbody></table></ng-template>
